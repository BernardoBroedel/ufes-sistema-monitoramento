# Configuracao do sistema de monitoramento.
# Qualquer chave aqui pode ser sobrescrita na linha de comando com -Dchave=valor.

# ---------------------------------------------------------------- Kafka
# Qualquer broker serve de bootstrap server (Aula 4: "broker discovery").
# Listando os tres, o cliente ainda conecta se um estiver fora.
kafka.bootstrap=localhost:9092,localhost:9094,localhost:9096

# ---------------------------------------------------------------- Coleta
# A API do IEMA atualiza de hora em hora; o polling mais curto existe para
# reduzir a latencia de deteccao. A deduplicacao por (idEstacao, dataHora)
# impede que isso vire 11 eventos repetidos por hora por estacao.
iema.intervalo.segundos=300
clima.intervalo.segundos=900

# Sem estes headers a API responde HTTP 200 com corpo vazio.
iema.user.agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64)
iema.referer=https://iema.es.gov.br/

# Coordenadas usadas para o clima (centro da Grande Vitoria)
clima.latitude=-20.3155
clima.longitude=-40.3128

# ---------------------------------------------------------------- F1: subida acelerada
# Calibrado sobre 48h reais (secao 7.5 da proposta):
#   subida > 5 pontos em 3h -> 7 disparos, 2 estacoes
#   subida > 3 pontos em 3h -> 12 disparos, 4 estacoes
#
# Adotado 3.0 apos observar que a janela movel da API varia muito de um dia para
# o outro: em 20/09 o maior salto foi de 16,7 pontos, e em 21/09, de apenas 3,6.
# Com 5.0 o sistema passaria dias inteiros sem gerar um unico evento de F1.
f1.janela.horas=3
f1.delta.minimo=3.0

# ---------------------------------------------------------------- F2: mudanca de faixa
# Usa o campo "Faixa" devolvido pela propria API; o limite abaixo serve
# apenas para o texto do alerta.
f2.limite.faixa.boa=40.0

# ---------------------------------------------------------------- F3: estacao offline
f3.atraso.maximo.horas=2
# Recuo temporal a partir do qual assumimos que e o produtor-replay, e nao uma
# estacao atrasada. Precisa ficar acima do maior atraso legitimo observado na
# rede (Cidade Continental chega a reportar com 8h de defasagem).
f3.salto.replay.horas=12

# ---------------------------------------------------------------- F4: estagnacao
# Evidencia: o episodio de 33h da Enseada do Sua (18/09 21h a 20/09 06h) se
# formou sob vento de 4 a 12 km/h e se dissipou com vento NE acima de 20 km/h.
f4.janela.horas=6
f4.iqar.minimo=40.0
f4.vento.maximo=8.0
f4.chuva.maxima=0.0

# ---------------------------------------------------------------- Notificador
notificador.csv=saida/alertas.csv
notificador.http.porta=8080

# Registro de deduplicacao do produtor (sobrevive a reinicios)
iema.dedup.arquivo=saida/.dedup-iema
