<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoramento do Ar — Grande Vitória</title>
<style>
  :root {
    --fundo: #0f1419;
    --cartao: #1a2129;
    --borda: #2a3441;
    --texto: #e6edf3;
    --suave: #8b98a5;
    --destaque: #58a6ff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --fundo: #f4f6f8; --cartao: #ffffff; --borda: #d8dee4;
      --texto: #1c2128; --suave: #5b6570; --destaque: #0969da;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: var(--fundo); color: var(--texto);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    flex-wrap: wrap; margin-bottom: 4px;
  }
  h1 { font-size: 19px; margin: 0; font-weight: 650; }
  .sub { color: var(--suave); font-size: 12.5px; }
  .pulso {
    width: 7px; height: 7px; border-radius: 50%;
    background: #3fb950; display: inline-block; margin-right: 5px;
    animation: pisca 2s infinite;
  }
  @keyframes pisca { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .grade { display: grid; grid-template-columns: 1fr 340px; gap: 16px; margin-top: 16px; }
  @media (max-width: 860px) { .grade { grid-template-columns: 1fr; } }

  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--suave); margin: 0 0 10px; font-weight: 600;
  }

  .estacoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 10px; }
  .estacao {
    border-radius: 10px; padding: 12px; border: 1px solid transparent;
    display: flex; flex-direction: column; gap: 2px; min-height: 124px;
  }
  .estacao .bairro { font-weight: 650; font-size: 13.5px; line-height: 1.25; }
  .estacao .cidade { font-size: 11px; opacity: .72; margin-bottom: 6px; }
  .estacao .iqar { font-size: 30px; font-weight: 700; line-height: 1; margin-top: auto; }
  .estacao .pol { font-size: 10.5px; opacity: .8; margin-top: 4px; }
  .estacao .fx { font-size: 11.5px; font-weight: 650; margin-top: 2px; }
  .estacao.offline {
    background: var(--cartao); border-color: var(--borda); color: var(--suave);
    border-style: dashed;
  }
  .estacao.offline .iqar { font-size: 15px; font-weight: 650; }

  .alertas { background: var(--cartao); border: 1px solid var(--borda); border-radius: 10px; padding: 12px; }
  .lista { max-height: 62vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .alerta { border-left: 3px solid var(--borda); padding: 7px 0 7px 10px; }
  .alerta.ALTA  { border-left-color: #f85149; }
  .alerta.MEDIA { border-left-color: #d29922; }
  .alerta.BAIXA { border-left-color: #58a6ff; }
  .alerta .top { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; }
  .alerta .tipo { font-weight: 700; letter-spacing: .02em; }
  .alerta .hora { color: var(--suave); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .alerta .local { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
  .alerta .msg { font-size: 11.5px; color: var(--suave); margin-top: 1px; }

  footer {
    margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--borda);
    display: flex; gap: 20px; flex-wrap: wrap;
    font-size: 12px; color: var(--suave); font-variant-numeric: tabular-nums;
  }
  footer b { color: var(--texto); font-weight: 650; }
  .vazio { color: var(--suave); font-size: 12.5px; padding: 18px 2px; }
</style>
</head>
<body>

<header>
  <h1>Qualidade do Ar — Grande Vitória</h1>
  <span class="sub"><span class="pulso"></span><span id="atualizado">conectando…</span></span>
</header>
<div class="sub">Dados da rede automática do IEMA-ES, entregues via Apache Kafka</div>

<div class="grade">
  <section>
    <h2>Estações</h2>
    <div class="estacoes" id="estacoes"></div>
  </section>

  <section class="alertas">
    <h2>Situações de interesse detectadas</h2>
    <div class="lista" id="alertas"></div>
  </section>
</div>

<footer id="rodape"></footer>

<script>
// Cores oficiais do IQAr. O valor de "Boa" e exatamente o que a API do IEMA
// devolve no campo Cor; os demais seguem a escala nacional do indice.
const CORES = {
  boa:        '#59FF2F',
  moderada:   '#FFD21E',
  ruim:       '#FF7E00',
  muitoruim:  '#FF3B30',
  pessima:    '#8B1A4A'
};

const normalizar = t => (t || '')
  .toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '');

// Texto escuro ou claro conforme a luminancia do fundo, para o cartao ficar legivel
// tanto no verde claro da faixa "Boa" quanto no vinho da "Pessima".
function corDoTexto(hex) {
  const r = parseInt(hex.slice(1, 3), 16),
        g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 < 0.55 ? '#ffffff' : '#10211a';
}

const hora = iso => {
  if (!iso) return '--';
  const d = new Date(iso);
  return isNaN(d) ? '--' : d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
};

const ROTULO = {
  F1_SUBIDA_ACELERADA: 'F1 · SUBIDA',
  F2_MUDANCA_FAIXA:    'F2 · FAIXA',
  F3_ESTACAO_OFFLINE:  'F3 · SENSOR',
  F4_ESTAGNACAO:       'F4 · ESTAGNAÇÃO'
};

function desenharEstacoes(lista) {
  const alvo = document.getElementById('estacoes');
  if (!lista.length) {
    alvo.innerHTML = '<div class="vazio">Aguardando medições do tópico ar.medicoes…</div>';
    return;
  }
  alvo.innerHTML = lista.map(e => {
    if (!e.operacional) {
      return `<div class="estacao offline">
        <div class="bairro">${e.localizacao}</div>
        <div class="cidade">${e.municipio}</div>
        <div class="iqar">sem dados</div>
        <div class="pol">estação não reporta</div>
        <div class="fx">⚠ F3</div>
      </div>`;
    }
    const cor = CORES[normalizar(e.faixa)] || '#8b98a5';
    const txt = corDoTexto(cor);
    return `<div class="estacao" style="background:${cor};color:${txt}">
      <div class="bairro">${e.localizacao}</div>
      <div class="cidade">${e.municipio}</div>
      <div class="iqar">${e.iqar.toFixed(1)}</div>
      <div class="pol">${e.poluenteCritico || ''}</div>
      <div class="fx">${e.faixa || ''} · ${hora(e.dataHoraMedicao)}</div>
    </div>`;
  }).join('');
}

function desenharAlertas(lista) {
  const alvo = document.getElementById('alertas');
  if (!lista.length) {
    alvo.innerHTML = '<div class="vazio">Nenhuma situação detectada ainda.<br>'
      + 'Rode o ProdutorReplay para reproduzir o histórico.</div>';
    return;
  }
  alvo.innerHTML = lista.map(a => `
    <div class="alerta ${a.severidade}">
      <div class="top">
        <span class="tipo">${ROTULO[a.tipo] || a.tipo}</span>
        <span class="hora">${hora(a.dataHora)}</span>
      </div>
      <div class="local">${a.localizacao} · ${a.municipio}</div>
      <div class="msg">${a.mensagem}</div>
    </div>`).join('');
}

function desenharRodape(c, clima) {
  const partes = [
    `ar.medicoes <b>${c.medicoes}</b>`,
    `ar.alertas <b>${c.alertas}</b>`,
    `derivados <b>${c.derivados}</b>`
  ];
  if (clima) {
    partes.push(`vento <b>${clima.ventoVelocidade.toFixed(1)} km/h</b>`);
    partes.push(`chuva <b>${clima.precipitacao.toFixed(1)} mm</b>`);
  }
  document.getElementById('rodape').innerHTML = partes.join(' &nbsp;·&nbsp; ');
}

async function atualizar() {
  try {
    const d = await (await fetch('/api/estado')).json();
    desenharEstacoes(d.estacoes || []);
    desenharAlertas(d.alertas || []);
    desenharRodape(d.contadores || {}, d.clima);
    document.getElementById('atualizado').textContent = 'atualizado às ' + hora(d.atualizadoEm);
  } catch (e) {
    document.getElementById('atualizado').textContent = 'sem conexão com o notificador';
  }
}

atualizar();
setInterval(atualizar, 5000);
</script>
</body>
</html>
