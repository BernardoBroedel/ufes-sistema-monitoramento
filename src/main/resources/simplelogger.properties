# Configuracao do slf4j-simple (logs internos do Kafka e do Kafka Streams).
#
# WARN mostra erros e avisos (rebalanceamento com falha, topico ausente, registro
# descartado pelo Streams) sem despejar no console o dump de configuracao que o
# Kafka imprime em INFO. A saida do proprio projeto (printf) nao passa por aqui.
#
# Para depurar uma topologia, suba o nivel na linha de comando:
#   java -Dorg.slf4j.simpleLogger.defaultLogLevel=info -cp target/monitoramento-ar.jar ...
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
